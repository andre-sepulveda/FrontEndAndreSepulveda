<!DOCTYPE html>
<html lang='pt-BR'>
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset='utf-8'>
    <title>Tarefas Acedemicas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <h1 id="title-to-do">To-do Academico</h1>
    </header>

    <section aria-label="Busca e Filtros">
        <label for="pesquisar-titulo">Pesquisar Titulo</label>
        <input id="pesquisar-titulo" type="search">
        <button class="botao">Salvar</button>
        <fieldset>
            <legend>Escolha o Status</legend>
            <input type="radio" name="status" id="a-fazer">
            <label for="a-fazer">A Fazer</label>
            <input type="radio" name="status" id="em-andamento">
            <label for="em-andamento">Em Andamento</label>
            <input type="radio" name="status" id="em-revisao">
            <label for="em-revisao">Em Revisão</label>
            <input type="radio" name="status" id="concluido">
            <label for="concluido">Concluído</label>
        </fieldset>
        <fieldset>
            <legend>Escolha a Prioridade</legend>
            <input type="radio" name="prioriadade" id="baixa">
            <label for="baixa">Baixa</label>
            <input type="radio" name="prioriadade" id="media">
            <label for="media">Média</label>
            <input type="radio" name="prioriadade" id="alta">
            <label for="alta">Alta</label>
        </fieldset>
    </section>

    <main id="quadro-geral" data-quadro="">
        <section class="coluna" aria-labelledby="titulo-coluna-1">
            <h2 id="titulo-coluna-1">A Fazer</h2>
            <ul data-lista-status="a-fazer">
            </ul>
        </section>

        <section class="coluna" aria-labelledby="titulo-coluna-2">
            <h2 id="titulo-coluna-2">Em Andamento</h2>
            <ul data-lista-status="em-andamento">
            </ul>
        </section>

        <section class="coluna" aria-labelledby="titulo-coluna-3">
            <h2 id="titulo-coluna-3">Em Revisão</h2>
            <ul data-lista-status="em-revisao">
            </ul>
        </section>

        <section class="coluna" aria-labelledby="titulo-coluna-4">
            <h2 id="titulo-coluna-4">Concluído</h2>
            <ul data-lista-status="concluido">
            </ul>
        </section>
    </main>
    <footer>André Sepúlveda Pereira Carvalho - Desenvolvimento Frontend</footer>
</body>
</html>
